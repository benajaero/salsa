[workspace]
members = [
  "core",
  "store",
  "agent",
  "app",
  "macos",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
directories = "5"
